[workspace]
resolver = "2"
members = ["ttrustle-lib", "ttrustle", "tttui", "ttgui", "ttserver"]

[workspace.package]
authors = ["Ali Sajid Imami <395482+AliSajid@users.noreply.github.com>"]
categories = ["game", "ai", "tictactoe", "menace"]
description = "Tic Tac Toe game with a Menace[ing] AI"
documentation = "https://docs.rs/crate/tictacrustle"
edition = "2024"
homepage = "https://aliimami.com/tictacrustle"
keywords = ["tictactoe", "menace", "rust"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/AliSajid/tictacrustle"
rust-version = "1.85.1"
version = "1.0.0-next.2"

[workspace.dependencies]
# Core workspace dependencies
anyhow = { version = "1.0.80", features = ["backtrace"] }
color-eyre = "0.6.5"
env_logger = "0.11.10"
log = "0.4.29"
rand = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Workspace profiles (shared across all crates)
# Profiles are configured in mise.toml for consistency
