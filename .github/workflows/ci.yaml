---
name: Continuous integration
on:
  push:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
concurrency:
  group: ${{github.event.ref}}
  cancel-in-progress: true
env:
  GIST_KEY: 185618f862b98debb8b034c34e83173d # pragma: allowlist secret
  RUST_BACKTRACE: 1
  MINIMUM_WAIT: 3
  MAXIMUM_WAIT: 10
jobs:
  ci:
    runs-on: ${{matrix.os}}-latest
    if: github.event_name == 'push' || (github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true) || github.event_name ==
      'workflow_dispatch'
    outputs:
      result: ${{steps.result.outputs.result}}
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta
          - nightly
          - 1.85.1 # MSRV
        os:
          - windows
          - ubuntu
          - macos
        include:
          - os: windows
            logo: windows
          - os: ubuntu
            logo: ubuntu
          - os: macos
            logo: apple
          - rust: 1.85.1 # MSRV
            label: msrv
          - rust: stable
            label: stable
          - rust: beta
            label: beta
          - rust: nightly
            label: nightly
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{matrix.rust}}
          components: rustfmt, clippy
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly
          components: rustfmt, clippy
      - name: Cache dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Cargo Build
        run: cargo build --verbose
      - name: Cargo Test
        run: cargo test
      - name: Cargo Format
        run: cargo fmt --all -- --check
      - name: Cargo Lint
        run: cargo clippy -- -D warnings
      - name: Wait before badge creation
        uses: AliSajid/random-wait-action@933d3635c56777d240b67abe794f1a5f7bdfd063 # v2.12.0
        with:
          minimum: ${{env.MINIMUM_WAIT}}
          maximum: ${{env.MAXIMUM_WAIT}}
      - name: Create Awesome Badge - Success
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        if: success()
        with:
          auth: ${{secrets.GIST_SECRET}}
          gistID: ${{env.GIST_KEY}}
          filename: ${{matrix.os}}-${{matrix.label}}.json
          label: Build
          namedLogo: ${{matrix.logo}}
          message: Succeeded
          color: green
      - name: Create Awesome Badge - Failure
        uses: schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        if: failure()
        with:
          auth: ${{secrets.GIST_SECRET}}
          gistID: ${{env.GIST_KEY}}
          filename: ${{matrix.os}}-${{matrix.label}}.json
          namedLogo: ${{matrix.logo}}
          label: Build
          message: Failed
          isError: true
      - name: Set Result
        if: always()
        id: result
        run: echo "result=${{job.status}}" >> "$GITHUB_OUTPUT"
  generate_code_coverage:
    uses: ./.github/workflows/code_coverage.yaml
    needs: [ci]
    secrets: inherit # pragma: allowlist secret
  generate_mdbook:
    uses: ./.github/workflows/deploy_mdbook.yaml
    needs: [ci]
    secrets: inherit # pragma: allowlist secret
  get-next-version:
    uses: ./.github/workflows/get_next_version.yaml
    needs: [ci]
    secrets: inherit # pragma: allowlist secret
  semantic-release:
    needs: [ci, get-next-version]
    if: ${{needs.get-next-version.outputs.new-release-published == 'true'}}
    uses: ./.github/workflows/release.yaml
    secrets: inherit # pragma: allowlist secret
