[package]
name = "ttassets"
authors.workspace = true
categories.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true
rust-version.workspace = true

# Per-crate settings for ttassets
# Terminal UI using crossterm/ratatui

[[bin]]
name = "ttassets"
path = "src/main.rs"

[dependencies]
# Core workspace dependencies
anyhow.workspace = true
ttrustle-lib = { path = "../ttrustle-lib" }

# Terminal UI dependencies
crossterm = "0.29"
ratatui = "0.30"

[lints]
rust.missing_docs = "allow"
rustdoc.broken_intra_doc_links = "deny"
rustdoc.invalid_rust_codeblocks = "deny"
rustdoc.redundant_explicit_links = "deny"
